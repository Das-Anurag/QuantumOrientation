<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quantum Orientation</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.179.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.179.1/examples/jsm/"
        }
    }
    </script>

</head>

<body>

    <h2>Quantum Orientation</h2>

    <!-- Vector Φ controls -->

    <div id="controls">

        <div class="input-group">

            <span>Φ Direction:</span>

            <label>
                α
                <input
                    id="alpha"
                    type="number"
                    value="1"
                    step="0.1"
                >
            </label>

            <label>
                β
                <input
                    id="beta"
                    type="number"
                    value="1"
                    step="0.1"
                >
            </label>

            <label>
                γ
                <input
                    id="gamma"
                    type="number"
                    value="0"
                    step="0.1"
                >
            </label>

        </div>


        <div class="input-group">

            <span>Φ Position:</span>

            <label>
                a
                <input
                    id="posA"
                    type="number"
                    value="0"
                    step="0.1"
                >
            </label>

            <label>
                b
                <input
                    id="posB"
                    type="number"
                    value="0"
                    step="0.1"
                >
            </label>

            <label>
                c
                <input
                    id="posC"
                    type="number"
                    value="0"
                    step="0.1"
                >
            </label>

        </div>

    </div>


    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
